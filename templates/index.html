<!DOCTYPE html>
<html>
<head>
    <title>Predicción de Ventas</title>
</head>
<body>

    <h1>Predicción de Ventas</h1>

    <form action="/predecir" method="POST">

        <input type="number" name="publicidad" placeholder="Ingrese publicidad">

        <button type="submit">
            Predecir
        </button>

    </form>

    {% if resultado %}
        <h2>Predicción: {{ resultado }}</h2>
    {% endif %}

</body>
</html>
